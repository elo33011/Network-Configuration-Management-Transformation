# deploy: make the change. Idempotent: a run that finds nothing to change reports changed=0.
# Run with --check --diff it changes nothing and reports what it would change: that is the drift check.
- hosts: all
  gather_facts: false
  vars_files:
    - ../vars/main.yml
  tasks:
    - name: Load NTP parameters from the template repo
      ansible.builtin.include_vars:
        file: "{{ ntp_parameters_file }}"
    - name: Render the intended NTP config from the template
      ansible.builtin.set_fact:
        intended_ntp: "{{ (lookup('ansible.builtin.template', ntp_template) | trim).splitlines() }}"
    - name: Read device config
      ansible.builtin.slurp:
        src: "{{ device_config }}"
      register: cfg
    - name: Build the config with the intended NTP block (idempotent)
      vars:
        base: "{{ (cfg.content | b64decode).splitlines() | reject('match', '^(ntp server |! (BEGIN|END) NTP)') | list }}"
        at: "{{ base.index('feature ssh') + 1 }}"
      ansible.builtin.set_fact:
        new_config: "{{ base[:at | int] + ['! BEGIN NTP (managed by pipeline)'] + intended_ntp + ['! END NTP (managed by pipeline)'] + base[at | int:] }}"
    - name: Write the config if it differs from the device
      ansible.builtin.copy:
        content: "{{ new_config | join('\n') }}\n"
        dest: "{{ device_config }}"
