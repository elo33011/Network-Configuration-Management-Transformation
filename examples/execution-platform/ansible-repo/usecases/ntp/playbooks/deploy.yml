# deploy: make the change.
- hosts: all
  gather_facts: false
  vars_files:
    - ../vars/main.yml
  tasks:
    - name: Load NTP parameters from the template repo
      ansible.builtin.include_vars:
        file: "{{ ntp_parameters_file }}"
    - name: Render the intended NTP config from the template
      ansible.builtin.set_fact:
        intended_ntp: "{{ (lookup('ansible.builtin.template', ntp_template) | trim).splitlines() }}"
    - name: Remove existing NTP server lines
      ansible.builtin.lineinfile:
        path: "{{ device_config }}"
        regexp: '^ntp server '
        state: absent
    - name: Add the intended NTP server lines
      ansible.builtin.blockinfile:
        path: "{{ device_config }}"
        marker: "! {mark} NTP (managed by pipeline)"
        insertafter: '^feature ssh'
        block: "{{ intended_ntp | join('\n') }}"
