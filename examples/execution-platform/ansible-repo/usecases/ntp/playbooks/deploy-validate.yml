# deploy-validate: straight after the deploy, does the device match the intent?
- hosts: all
  gather_facts: false
  vars_files:
    - ../vars/main.yml
  tasks:
    - name: Load NTP parameters from the template repo
      ansible.builtin.include_vars:
        file: "{{ ntp_parameters_file }}"
    - name: Render the intended NTP config from the template
      ansible.builtin.set_fact:
        intended_ntp: "{{ (lookup('ansible.builtin.template', ntp_template) | trim).splitlines() }}"
    - name: Read device config
      ansible.builtin.slurp:
        src: "{{ device_config }}"
      register: cfg
    - name: Assert device NTP lines equal the intended NTP lines
      ansible.builtin.assert:
        that: (cfg.content | b64decode).splitlines() | select('match', '^ntp server ') | list == intended_ntp
        fail_msg: "NTP on {{ inventory_hostname }} does not match the template repo"
