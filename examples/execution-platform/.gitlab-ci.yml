# Pipeline for the Ansible repository (illustrative, not executed in this example).
# Dev and QA run on the matching branch. Prod runs on a release tag, behind the change gate.
# The template repository is made visible to the playbooks at template-repo/ before any job runs.

stages: [structure, dev, qa, prod]

default:
  tags: [network-automation-runner]     # dedicated Git runners
  before_script:
    - git clone --depth 1 "$TEMPLATE_REPO_URL" template-repo   # linked template + NMS repo

structure:
  stage: structure
  script:
    - for d in ansible-repo/usecases/*/; do python3 ansible-repo/scripts/check_usecase.py "$d"; done
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

dev:
  stage: dev
  script:
    - ansible-repo/scripts/run_usecase.sh "$USECASE" dev     # deploy phase, then rollback phase
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

qa:
  stage: qa
  script:
    - ./fetch_inventory_from_datastore.sh qa    # firm system: network inventory data store (stub)
    - ./fetch_credentials_from_vault.sh qa      # firm system: vault (stub)
    - ansible-repo/scripts/run_usecase.sh "$USECASE" qa      # deploy phase, then rollback phase
  rules:
    - if: '$CI_COMMIT_BRANCH == "qa"'

prod:
  stage: prod
  script:
    - python3 ansible-repo/scripts/change_gate.py            # fails -> nothing below runs
    - ansible-repo/scripts/run_usecase.sh "$USECASE" prod    # deploy phase only
  rules:
    - if: '$CI_COMMIT_TAG'
