! access-switch.tmpl  (stored in the execution platform - no version, no history)
! Variables are filled in by the engineer at deployment time.
hostname abc-hq-f01-acc-01
!
ntp server 10.0.0.10
logging host 10.0.0.20
snmp-server community public123 RO
!
vlan 100
 name DATA
vlan 200
 name VOICE
!
interface range Gi1/0/1-48
 switchport mode access
 switchport access vlan 100
 switchport voice vlan 200
 spanning-tree portfast
!
interface Te1/1/1
 description UPLINK-TO-abc-hq-agg-01
 switchport mode trunk
interface Te1/1/2
 description UPLINK-TO-abc-hq-agg-02
 switchport mode trunk
