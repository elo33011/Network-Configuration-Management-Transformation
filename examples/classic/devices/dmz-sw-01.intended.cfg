! baseline/nexus-9300.tmpl - hardware-platform baseline (identical for every environment)
! Stored in the execution platform - no version, no history.
hostname abc-dmz-sw-01
!
feature ssh
feature lacp
feature lldp
!
ntp server 10.0.0.10 use-vrf management
logging server 10.0.0.20 use-vrf management
snmp-server community public123 ro
!
aaa authentication login default group tacacs+ local
banner motd ^Authorised use only^
!
vrf context management
 ip route 0.0.0.0/0 10.1.0.1
interface mgmt0
 vrf member management
 ip address 10.1.0.21/24
!
copp profile strict
! environment/dmz.tmpl - config for operating in the DMZ
no cdp enable
no feature telnet
!
ip access-list DMZ-IN
 10 permit tcp any 172.16.40.0/24 eq 443
 20 deny ip any any log
!
vlan 400
 name DMZ
!
interface Ethernet1/1-24
 switchport mode access
 switchport access vlan 400
 switchport port-security maximum 1
 storm-control broadcast level 1
 ip access-group DMZ-IN in
!
interface Ethernet1/25-48
 shutdown
