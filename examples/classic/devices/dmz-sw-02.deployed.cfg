! baseline/nexus-9300-NEW.tmpl - copied for the DMZ rollout, "improved" and never merged back
! Stored in the execution platform - no version, no history.
hostname abc-dmz-sw-02
!
feature ssh
feature lacp
feature lldp
!
ntp server 10.0.0.11 use-vrf management
logging server 10.0.0.25 use-vrf management
snmp-server user MONITOR network-operator auth sha EXAMPLE-ONLY
!
aaa authentication login default group tacacs+ local
banner motd ^Authorised use only^
!
vrf context management
 ip route 0.0.0.0/0 10.1.0.1
interface mgmt0
 vrf member management
 ip address 10.1.0.22/24
!
copp profile moderate
! environment/dmz-NEW.tmpl - copied after the web tier moved; old one never retired
no cdp enable
no feature telnet
!
ip access-list DMZ-IN
 10 permit tcp any 172.16.40.0/24 range 443 8443
 20 deny ip any any log
!
vlan 400
 name DMZ
!
interface Ethernet1/1-24
 switchport mode access
 switchport access vlan 400
 switchport port-security maximum 1
 storm-control broadcast level 5
 ip access-group DMZ-IN in
!
interface Ethernet1/25-48
 shutdown
