! baseline/nexus-9300.tmpl - hardware-platform baseline (identical for every environment)
! Stored in the execution platform - no version, no history.
hostname abc-dc-sw-01
!
feature ssh
feature lacp
feature lldp
!
ntp server 10.0.0.10 use-vrf management
logging server 10.0.0.20 use-vrf management
snmp-server community public123 ro
!
aaa authentication login default group tacacs+ local
banner motd ^Authorised use only^
!
vrf context management
 ip route 0.0.0.0/0 10.1.0.1
interface mgmt0
 vrf member management
 ip address 10.1.0.11/24
!
copp profile strict
! environment/datacenter.tmpl - config for operating in the Data Center
system jumbomtu 9216
feature vpc
feature interface-vlan
!
vlan 300
 name SERVERS
!
interface port-channel1
 description VPC-PEER-LINK
 switchport mode trunk
 vpc peer-link
!
interface Ethernet1/1-40
 switchport mode access
 switchport access vlan 300
 spanning-tree port type edge
