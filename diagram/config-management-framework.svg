<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 590" width="1180" height="590" font-family="Helvetica, Arial, sans-serif">
  <title>Configuration management framework</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#44546a"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="1180" height="590" fill="#ffffff"/>
  <text x="590" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2933">Configuration Management Framework</text>

  <!-- main chain -->
  <g stroke-width="2">
    <rect x="40"  y="80" width="200" height="120" rx="8" fill="#eef3fb" stroke="#3b6ea8"/>
    <rect x="340" y="80" width="200" height="120" rx="8" fill="#eef3fb" stroke="#3b6ea8"/>
    <rect x="640" y="80" width="200" height="120" rx="8" fill="#eef3fb" stroke="#3b6ea8"/>
    <rect x="940" y="80" width="200" height="120" rx="8" fill="#eef7ee" stroke="#4c9a5a"/>
  </g>
  <g fill="#1f2933" text-anchor="middle">
    <text x="140" y="108" font-size="16" font-weight="700">1. Design</text>
    <text x="140" y="136" font-size="12">Intent: topology, roles,</text>
    <text x="140" y="154" font-size="12">addressing, policy.</text>
    <text x="140" y="178" font-size="12" font-style="italic">What it should be</text>

    <text x="440" y="108" font-size="16" font-weight="700">2. Template</text>
    <text x="440" y="136" font-size="12">Templates + NMS parameters,</text>
    <text x="440" y="154" font-size="12">in Git, code owner governed.</text>
    <text x="440" y="178" font-size="12" font-style="italic">What to render</text>

    <text x="740" y="108" font-size="16" font-weight="700">3. Execution Platform</text>
    <text x="740" y="136" font-size="12">Ansible pipeline: renders and</text>
    <text x="740" y="154" font-size="12">pushes under change control.</text>
    <text x="740" y="178" font-size="12" font-style="italic">How it gets there</text>

    <text x="1040" y="108" font-size="16" font-weight="700">4. Device Config</text>
    <text x="1040" y="136" font-size="12">Running config on</text>
    <text x="1040" y="154" font-size="12">the device.</text>
    <text x="1040" y="178" font-size="12" font-style="italic">What it actually is</text>
  </g>

  <!-- main arrows -->
  <g stroke="#44546a" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M240,140 H338"/>
    <path d="M540,140 H638"/>
    <path d="M840,140 H938"/>
  </g>
  <g fill="#44546a" font-size="11" text-anchor="middle">
    <text x="290" y="132">implemented as</text>
    <text x="590" y="119">rendered and</text><text x="590" y="132">deployed from</text>
    <text x="890" y="132">pushes to</text>
  </g>

  <!-- drift check -->
  <rect x="490" y="390" width="260" height="110" rx="8" fill="#fff4e5" stroke="#c2410c" stroke-width="2"/>
  <g fill="#1f2933" text-anchor="middle">
    <text x="620" y="418" font-size="16" font-weight="700">5. Drift Check</text>
    <text x="620" y="444" font-size="12">Re-runs the playbook in check</text>
    <text x="620" y="460" font-size="12">mode: renders intended config,</text>
    <text x="620" y="476" font-size="12">compares it to the device.</text>
  </g>

  <!-- inputs to drift check -->
  <g stroke="#44546a" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M440,200 V445 H488"/>
    <path d="M1040,200 V420 H752"/>
  </g>
  <g fill="#44546a" font-size="11">
    <text x="450" y="300">intended config</text>
    <text x="450" y="315">(from template)</text>
    <text x="1050" y="300">running config</text>
    <text x="1050" y="315">(collected, read-only)</text>
  </g>


  <!-- dashboard -->
  <rect x="860" y="450" width="280" height="80" rx="8" fill="#eef7ee" stroke="#4c9a5a" stroke-width="2"/>
  <g fill="#1f2933" text-anchor="middle">
    <text x="1000" y="478" font-size="16" font-weight="700">Drift Dashboard</text>
    <text x="1000" y="500" font-size="12">In sync / drifted, by device,</text>
    <text x="1000" y="515" font-size="12">with the exact difference.</text>
  </g>
  <path d="M752,485 H858" stroke="#44546a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="805" y="477" font-size="11" fill="#44546a" text-anchor="middle">drift data</text>

  <!-- feedback from drift check -->
  <g stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#d)">
    <path d="M600,390 V310 H700 V202"/>
    <path d="M580,500 V550 H140 V202"/>
  </g>
  <g fill="#c2410c" font-size="11">
    <text x="708" y="262">remediate:</text>
    <text x="708" y="277">apply the same playbook again</text>
    <text x="160" y="540">drift found: change the design / template through review, never the device only</text>
  </g>
</svg>
